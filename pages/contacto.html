<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Store</title>
    <link rel="icon" href="./img/note-sticky-solid-full.svg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Asap+Sharp:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
    <header>
        <div class="div-logo"><a class="logo" href="../index.html">LOGO</a></div>
        <nav class="header-nav">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./carrito.html">Carrito</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
                <li><a href="./nosotros.html">Nosotros</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contacto">
            <h1 class="titulo-contacto text-secondary">Contactanos!</h1>
            <form class="form-contacto" action="https://formspree.io/f/mppqzere" method="POST">
                <div class="grupo-input">
                    <label for="email">Tu email</label>
                    <input id="email" type="email" name="email"/>
                </div>
                <div class="grupo-input">
                    <label for="mensaje">Tu mensaje</label>
                    <textarea name="message" id="mensaje"></textarea>
                </div>
                <button class="btn bg-secondary text-dark" type="submit">Enviar</button>
            </form>
            <h2 class="text-dark">También podés hablarnos por nuestras redes</h3>
            <div class="link-contacto">
                <ul>
                    <li><img src="../img/whatsapp-brands-solid-full.svg" alt="Logo Whatsapp"><img src="../img/instagram-brands-solid-full.svg" alt="Logo Instagram">
                    </li>
                </ul>
                
                
        </section>
    </main>
    <footer>
        <p>Sitio realizado por Martina para Talento Tech</p>
        <nav>
            <ul class="footer-list">
                <li><img src="../img/whatsapp-brands-solid-full.svg" alt="Logo Whatsapp"><img src="../img/instagram-brands-solid-full.svg" alt="Logo Instagram"></li>
            </ul>
        </nav>
    </footer>
</body>
</html>
